# Lexington-Fayette Urban County Government — the reference jurisdiction.
#
# These values reproduce the historical hard-coded defaults exactly; they
# are also baked into config.py as the built-in fallback, so deleting this
# file changes nothing for LFUCG. To onboard a new county, copy this file
# to jurisdictions/<slug>.toml, edit the values, and run with
# JURISDICTION=<slug>.
#
# Per-field override order: env var (GRANICUS_HOST / FIRST_CLIP_ID /
# GRANICUS_VIEW_ID / LFUCG_OUTPUT_DIR) > this file > config.py default.

[jurisdiction]
slug = "lfucg"
name = "Lexington-Fayette Urban County Government"

[granicus]
host = "lfucg.granicus.com"
default_view_id = 14
# Views scanned (in order) when the default view doesn't contain a clip —
# non-council bodies (Task Force, Planning Commission, BoZA, …) live on
# their own views. Most-trafficked first.
listing_view_fallbacks = [14, 9, 2, 4, 5, 6, 7, 8, 10, 13, 16, 17]
first_clip_id = 6669

[source]
# Video-source adapter (WS2). "granicus" is the only implementation today;
# a later PR adds "youtube". LFUCG ingests from a Granicus portal.
type = "granicus"

[taxonomy]
# Meeting-body alternatives matched (word-boundary, case-insensitive) in
# the clip title. body_acronyms stay uppercased; everything else is
# title-cased.
body_patterns = ["WQFB", "CAC", "LFUCG", "Council", "Commission", "Board", "Committee"]
body_acronyms = ["WQFB", "CAC", "LFUCG"]

[storage]
# ChromaDB collection name. MUST be unique per jurisdiction if two ever
# share a ChromaDB path (they shouldn't under the one-box-per-jurisdiction
# model — see deploy/lightsail/ARCHITECTURE_REVIEW.md).
chroma_collection = "lfucg_meetings"
# Infra targets read by deploy/lightsail/provision-jurisdiction.sh (the
# provisioner parses this TOML directly via tomllib — config.py does not
# consume these two keys today, so they're inert for the running app).
# s3_bucket was historically hard-coded in deploy.sh; cloudfront_dist_id was
# env-only / LFUCG-defaulted. The provisioner writes cloudfront_dist_id back
# here when it creates a new distribution (self-documenting).
s3_bucket = "s3://public-meetings"
cloudfront_dist_id = "E8OIXOXDRETLZ"

[site]
site_url = "https://meetings.lexingtonky.news"
# Caddy/Lightsail origin hostname (the host CloudFront's /api/* behavior
# talks to). Read by the provisioner; not consumed by config.py today.
origin_hostname = "meetings-origin.lexingtonky.news"

[publication]
# Public-facing identity used across the SEO artifacts (llms.txt, news
# sitemap, per-clip clip.md), the RAG/MCP server prose, and the FastAPI
# title. These reproduce the historical hard-coded LFUCG literals.
publication_name = "LFUCG Meeting Archive"
operator_name = "Paul Oliva"
editor_email = "editor@lexingtonky.news"

[integrations]
# Optional downstream wiring read by the provisioner (rendered into the box's
# .env as FEEDS_WEBHOOK_URL). The matching secret (FEEDS_API_TOKEN) stays in
# .env only — never in this committed TOML. Not consumed by config.py.
feeds_webhook_url = "https://feeds.lexingtonky.news/api/ingest/lfucg-meeting-archive"
