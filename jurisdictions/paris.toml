# Paris, Kentucky (Bourbon County seat) — first non-Granicus onboarding candidate.
#
# DOCUMENT-DRIVEN ARCHIVE (PR-6). Paris posts meeting video to YouTube, but
# YouTube hard-blocks BOTH downloads and captions from any datacenter / cloud
# IP (verified: yt-dlp + youtube-transcript-api both get "Sign in to confirm
# you're not a bot" / RequestBlocked from the Lightsail box; no player_client
# workaround helps). So there is no audio and no caption track to work with
# from the server. Paris's CivicClerk portal, however, serves the official
# Agenda + Minutes documents for free with no bot-block (verified working) —
# and those documents (votes, motions, appropriations, decisions) ARE the
# authoritative record of what each meeting did.
#
# Decision: build Paris as a document-driven archive. Each meeting's record is
# its official minutes (falling back to the agenda when minutes aren't
# published yet); the facts → summary → RAG flow runs on that text. No YouTube,
# no audio, no Whisper. The PRIMARY source is `civicclerk` (CivicClerkSource),
# NOT a YouTube video source with a separate agenda fallback.
#
# STATUS: validated, pending infra. The CivicClerk source below is REAL and
# validated live (events + agenda packets + minutes present on
# parisky.api.civicclerk.com). Branding decided: the civicmemory.news umbrella
# (per MULTI_COUNTY_EXPANSION_SPEC.md §4). Remaining prerequisites before
# provision:
#   1. Register civicmemory.news + add the zone to Cloudflare (+ a DNS:Edit token).
#   2. Run deploy/lightsail/provision-jurisdiction.sh paris (creates box/S3/IAM/DNS).
#   3. Create the CloudFront distribution (provisioner prints settings + records
#      the dist id back into cloudfront_dist_id below).
#   4. Cold-start the archive, validate, flip DNS.

[jurisdiction]
slug = "paris"
name = "City of Paris, Kentucky"

[source]
# PRIMARY document-driven source: the meeting record IS its CivicClerk
# agenda + minutes (no video/audio/captions). Reads the [agenda] endpoint
# below for the CivicClerk API. start_id seeds the synthetic clip-id map.
type = "civicclerk"

[source.youtube]
# CivicClerkSource reuses the `start_id` knob to seed its synthetic clip-id
# map (events have portal ids we don't control, so we map them onto a local
# 1..N sequence).
start_id = 1
# Paris posts each REGULAR commission meeting to this YouTube channel (the
# document-driven pipeline can't DOWNLOAD/caption from the box, but the public
# can watch — and the box CAN still LIST the channel). `--match-videos` lists
# this channel, parses the date out of each title, and stamps a per-clip
# `video_url` so meeting pages link to the real YouTube video. Workshops /
# special meetings aren't posted, so those clips get no video link.
channel_url = "https://www.youtube.com/@CityofParisKY"

[taxonomy]
# Paris is governed by a City Commission; keep the generic body words so
# committee/board meetings on the channel are classified too.
body_patterns = ["Commission", "Council", "Committee", "Board"]
body_acronyms = []

[agenda]
# CivicClerkSource reads api_base/portal from here (the same keys the WS4
# CivicClerkAgendaSource used). type is kept "civicclerk" so the endpoint
# resolves; the primary [source] type above drives which adapter runs.
type = "civicclerk"
api_base = "https://parisky.api.civicclerk.com"
portal = "https://parisky.portal.civicclerk.com"

[storage]
chroma_collection = "paris_meetings"
s3_bucket = "s3://paris-civic-meetings"
cloudfront_dist_id = "E28B7ORY9035LU"                            # created at provision (written back by the script)

[site]
site_url = "https://paris.civicmemory.news"        # pending civicmemory.news registration
origin_hostname = "paris-origin.civicmemory.news"  # pending civicmemory.news registration

[publication]
publication_name = "Paris Meeting Archive"
operator_name = "Paul Oliva"
editor_email = "editor@civicmemory.news"

[frontend]
# SPA copy overrides deep-merged onto config.build_site_config()'s derivations.
# Only the bits the generic derivation gets wrong for a document-driven city are
# set here; everything else (archive_name, site_url, contact_email, source.kind=
# document, feeds.enabled=false, …) derives correctly from the fields above.
jurisdiction_short_name = "Paris"
default_seo_title = "Paris Meeting"
# Document-driven: no verbatim transcript, and it's a Commission (not Council).
tagline = "City of Paris, Kentucky Meeting Records & Summaries"
description = "Searchable archive of City of Paris, Kentucky commission and committee meetings — official agendas, minutes, AI summaries, and structured facts."

[frontend.video]
# Regular meetings are matched to City of Paris YouTube videos (per-clip
# video_url); unmatched workshops/special meetings show no video section.
provider = "youtube"

[frontend.chat]
title = "Ask the Paris Archive"
description = "Ask questions about City of Paris, Kentucky commission meetings, votes, budgets, and more."
placeholder = "Ask a question about Paris city meetings..."
