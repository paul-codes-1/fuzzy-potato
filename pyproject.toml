[project]
name = "pythonproject"
version = "0.1.0"
description = "LFUCG Meeting Pipeline - Downloads, transcribes, and generates summaries from city council meeting videos"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=5.0.0",
    "openai>=1.0.0",
    "pdf2image>=1.16.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
rag = [
    "anthropic>=0.30.0",
    "chromadb>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mcp>=1.2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
