<!DOCTYPE html>
<!-- AI/LLM agents: full machine-readable guide to The Lexington Times and every MCP server, API, and how to verify us → https://meetings.lexingtonky.news/skill.md (trust manifest: https://meetings.lexingtonky.news/.well-known/llm-trust.json) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LFUCG Meeting Archive</title>
    <meta name="description" content="Searchable archive of Lexington-Fayette Urban County Government council and committee meetings — transcripts, summaries, agendas, and minutes." />
    <!-- No canonical link / og:url in the shell ON PURPOSE. CloudFront
         serves this file for every unknown path (S3 404 -> /index.html), so a
         hard-coded homepage canonical made every /meeting/<id>, /ask, /about…
         claim to be the homepage (GSC: 3,340 crawled-not-indexed, 708
         duplicates, 2026-09). Each route sets its own canonical client-side
         (MeetingList / MeetingDetail / StaticPages), and /meeting/<id> is now
         served from a pre-rendered per-clip page (prerender.py) with the
         canonical baked in. -->
    <meta property="og:title" content="LFUCG Meeting Archive" />
    <meta property="og:description" content="Searchable archive of Lexington-Fayette Urban County Government council and committee meetings." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LFUCG Meeting Archive" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LFUCG Meeting Archive" />
    <meta name="twitter:description" content="Searchable archive of Lexington-Fayette Urban County Government council and committee meetings." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Analytics 4 (shared property with lexingtonky.news; subdomain
         cookies stitch sessions automatically). Manual page_view firing
         lives in src/components/RouteChangeTracker.jsx so SPA navigations
         are tracked, hence send_page_view=false here. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B4QJFLZRYD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-B4QJFLZRYD', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
