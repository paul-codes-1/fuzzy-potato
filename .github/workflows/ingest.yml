name: ingest-meetings

# Polls Granicus (lfucg.granicus.com) every 6 hours for new clips,
# downloads + transcribes + summarizes them, ingests into ChromaDB,
# rebuilds the search index and sitemaps, syncs to S3, and pings the
# feeds.lexingtonky.news webhook so it pulls the new archive items.
#
# Skips the heavy maintenance steps (backfill-docs, upgrade-summaries)
# and the RAG API redeploy (Docker push + App Runner) — the cron only
# touches data, not the API code. Run those manually via
# `workflow_dispatch` or locally when needed.

on:
  schedule:
    # Every 6 hours, on the hour, in UTC. GH cron min granularity is 5 min;
    # 6h gives reasonable freshness without burning tokens on no-ops.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_clips:
        description: "Cap on new clips per run (blank = no cap)"
        required: false
        default: "10"
      run_backfill:
        description: "Also run --backfill-docs --regenerate-summary"
        type: boolean
        default: false
      run_upgrade_summaries:
        description: "Also run --upgrade-summaries"
        type: boolean
        default: false

concurrency:
  # Two runs at once would race on the S3 → local → S3 sync. Cancel
  # in-flight runs on a new trigger so the latest poll wins.
  group: ingest-meetings
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: us-east-1
      AWS_PAGER: ""
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FEEDS_API_TOKEN: ${{ secrets.FEEDS_API_TOKEN }}
      CLOUDFRONT_DISTRIBUTION_ID: E8OIXOXDRETLZ
      # Skip heavy steps in the routine cron — these run separately on demand.
      SKIP_RAG_DEPLOY: "1"
      SKIP_BACKFILL: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_backfill) && '0' || '1' }}
      SKIP_UPGRADE_SUMMARIES: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_upgrade_summaries) && '0' || '1' }}
      MAX_CLIPS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_clips || '10' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk
        # GH-hosted runners ship with ~6GB of cached images we don't need.
        # The state pull is ~9GB so reclaim space up-front.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Install system deps (ffmpeg, tesseract, poppler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr poppler-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python deps
        run: uv sync --extra rag

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Pull existing meeting state from S3
        # The pipeline needs every clip's metadata.json + transcript.txt +
        # agenda.txt to regenerate index.json correctly (otherwise old clips
        # disappear from the SPA), and chroma_db/ to extend the vector store.
        # MP3s are excluded — they're already not kept in this pipeline.
        # ~9GB transfer per run; expensive on bandwidth, so check S3 metrics.
        run: |
          mkdir -p lfucg_output
          aws s3 sync \
            s3://public-meetings/data/ \
            ./lfucg_output/ \
            --exclude "*.mp3" \
            --exclude "*.mp4" \
            --exclude "*.part" \
            --no-progress
          echo "==> Disk after state pull:"
          df -h .

      - name: Run ingest pipeline
        run: ./ingest_all.sh
