<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicLens Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .uptime-bar { display: flex; gap: 1px; height: 32px; }
        .uptime-day { flex: 1; min-width: 2px; border-radius: 2px; cursor: pointer; position: relative; }
        .uptime-day:hover .tooltip { display: block; }
        .tooltip {
            display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            background: #1f2937; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px;
            white-space: nowrap; z-index: 10; margin-bottom: 4px;
        }
        .status-operational { background-color: #22c55e; }
        .status-degraded { background-color: #eab308; }
        .status-partial_outage { background-color: #f97316; }
        .status-major_outage { background-color: #ef4444; }
        .status-maintenance { background-color: #3b82f6; }
        .status-no-data { background-color: #e5e7eb; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">CivicLens Status</h1>
                <p class="text-sm text-gray-500 mt-1">Real-time system status and incident history</p>
            </div>
            <div id="overall-badge" class="px-4 py-2 rounded-full text-sm font-medium"></div>
        </div>

        <!-- Active Incidents Banner -->
        <div id="incidents-banner" class="hidden mb-6"></div>

        <!-- Scheduled Maintenance Banner -->
        <div id="maintenance-banner" class="hidden mb-6"></div>

        <!-- Components -->
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8">
            <div class="px-5 py-4 border-b border-gray-100">
                <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">Components</h2>
            </div>
            <div id="components-list" class="divide-y divide-gray-100"></div>
        </div>

        <!-- Uptime Section -->
        <div id="uptime-section" class="space-y-6 mb-8"></div>

        <!-- Incident History -->
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm mb-8">
            <div class="px-5 py-4 border-b border-gray-100">
                <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">Incident History</h2>
            </div>
            <div id="incident-history" class="p-5">
                <p class="text-gray-400 text-sm">Loading...</p>
            </div>
        </div>

        <!-- Subscribe -->
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-5 mb-8">
            <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">Subscribe to Updates</h2>
            <p class="text-sm text-gray-500 mb-3">Get notified when components experience issues or scheduled maintenance.</p>
            <form id="subscribe-form" class="flex gap-2" onsubmit="handleSubscribe(event)">
                <input type="email" placeholder="you@example.com" required
                    class="flex-1 px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                <button type="submit"
                    class="px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded-md hover:bg-gray-800 transition-colors">
                    Subscribe
                </button>
            </form>
            <p id="subscribe-msg" class="text-sm mt-2 hidden"></p>
        </div>

        <!-- Footer -->
        <div class="text-center text-xs text-gray-400 pb-4">
            <p>Auto-refreshes every 60 seconds &middot; <span id="last-updated"></span></p>
            <p class="mt-1">Powered by <span class="font-medium text-gray-500">CivicLens</span></p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost'
            ? 'http://127.0.0.1:8000'
            : '';

        const STATE_LABELS = {
            operational: 'Operational',
            degraded: 'Degraded Performance',
            partial_outage: 'Partial Outage',
            major_outage: 'Major Outage',
            maintenance: 'Under Maintenance',
        };

        const STATE_COLORS = {
            operational: 'bg-green-500',
            degraded: 'bg-yellow-400',
            partial_outage: 'bg-orange-500',
            major_outage: 'bg-red-500',
            maintenance: 'bg-blue-500',
        };

        const STATE_TEXT_COLORS = {
            operational: 'text-green-700 bg-green-50 border-green-200',
            degraded: 'text-yellow-700 bg-yellow-50 border-yellow-200',
            partial_outage: 'text-orange-700 bg-orange-50 border-orange-200',
            major_outage: 'text-red-700 bg-red-50 border-red-200',
            maintenance: 'text-blue-700 bg-blue-50 border-blue-200',
        };

        const SEVERITY_COLORS = {
            minor: 'border-yellow-300 bg-yellow-50',
            major: 'border-orange-300 bg-orange-50',
            critical: 'border-red-300 bg-red-50',
        };

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function relativeTime(iso) {
            const diff = Date.now() - new Date(iso).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return `${mins}m ago`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return `${hrs}h ago`;
            const days = Math.floor(hrs / 24);
            return `${days}d ago`;
        }

        function renderOverallBadge(status) {
            const el = document.getElementById('overall-badge');
            const cls = STATE_TEXT_COLORS[status] || STATE_TEXT_COLORS.operational;
            el.className = `px-4 py-2 rounded-full text-sm font-medium border ${cls}`;
            el.textContent = status === 'operational' ? 'All Systems Operational' : STATE_LABELS[status] || status;
        }

        function renderComponents(components) {
            const list = document.getElementById('components-list');
            list.innerHTML = components.map(c => `
                <div class="flex items-center justify-between px-5 py-3">
                    <span class="text-sm font-medium text-gray-800">${c.name}</span>
                    <div class="flex items-center gap-2">
                        <span class="text-xs ${c.state === 'operational' ? 'text-green-600' : c.state === 'degraded' ? 'text-yellow-600' : c.state === 'maintenance' ? 'text-blue-600' : 'text-red-600'}">${STATE_LABELS[c.state] || c.state}</span>
                        <span class="w-2.5 h-2.5 rounded-full ${STATE_COLORS[c.state] || 'bg-gray-300'}"></span>
                    </div>
                </div>
            `).join('');
        }

        function renderActiveIncidents(incidents) {
            const banner = document.getElementById('incidents-banner');
            if (!incidents || incidents.length === 0) {
                banner.classList.add('hidden');
                return;
            }
            banner.classList.remove('hidden');
            banner.innerHTML = incidents.map(inc => `
                <div class="border rounded-lg p-4 mb-2 ${SEVERITY_COLORS[inc.severity] || ''}">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-semibold text-sm text-gray-900">${inc.title}</span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-gray-200 text-gray-600">${inc.status}</span>
                    </div>
                    <p class="text-xs text-gray-500 mb-1">Affecting: ${inc.components_affected.join(', ')}</p>
                    ${inc.updates && inc.updates.length > 0 ? `
                        <p class="text-sm text-gray-700">${inc.updates[inc.updates.length - 1].message}</p>
                        <p class="text-xs text-gray-400 mt-1">${relativeTime(inc.updates[inc.updates.length - 1].created_at)}</p>
                    ` : ''}
                </div>
            `).join('');
        }

        function renderMaintenance(windows) {
            const banner = document.getElementById('maintenance-banner');
            if (!windows || windows.length === 0) {
                banner.classList.add('hidden');
                return;
            }
            banner.classList.remove('hidden');
            banner.innerHTML = windows.map(m => `
                <div class="border border-blue-200 bg-blue-50 rounded-lg p-4 mb-2">
                    <div class="flex items-center gap-2 mb-1">
                        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span class="font-semibold text-sm text-blue-800">${m.title}</span>
                    </div>
                    <p class="text-xs text-blue-600">
                        ${formatDate(m.scheduled_start)} - ${formatDate(m.scheduled_end)}
                    </p>
                    <p class="text-xs text-blue-500 mt-1">Components: ${m.components.join(', ')}</p>
                </div>
            `).join('');
        }

        function renderUptime(uptimeData, dailyData) {
            const section = document.getElementById('uptime-section');
            if (!uptimeData) { section.innerHTML = ''; return; }

            section.innerHTML = Object.entries(uptimeData).map(([comp, pcts]) => {
                const days = dailyData && dailyData[comp] ? dailyData[comp] : [];
                const pct90 = pcts['90d'];
                return `
                    <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-5">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm font-medium text-gray-800">${comp}</span>
                            <span class="text-xs text-gray-500">${pct90}% uptime (90d)</span>
                        </div>
                        <div class="uptime-bar">
                            ${days.map(d => `
                                <div class="uptime-day status-${d.status}">
                                    <div class="tooltip">${d.date}: ${d.uptime_pct}%</div>
                                </div>
                            `).join('')}
                            ${days.length === 0 ? '<div class="flex-1 rounded bg-green-400 opacity-50" style="height:32px"></div>' : ''}
                        </div>
                        <div class="flex justify-between mt-1">
                            <span class="text-xs text-gray-400">90 days ago</span>
                            <span class="text-xs text-gray-400">Today</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderIncidentHistory(incidents) {
            const el = document.getElementById('incident-history');
            if (!incidents || incidents.length === 0) {
                el.innerHTML = '<p class="text-sm text-gray-400">No incidents reported in the last 90 days.</p>';
                return;
            }
            el.innerHTML = incidents.map(inc => `
                <div class="mb-6 last:mb-0">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-2 h-2 rounded-full ${inc.status === 'resolved' ? 'bg-green-400' : 'bg-red-400'}"></span>
                        <span class="font-medium text-sm text-gray-900">${inc.title}</span>
                        <span class="text-xs px-2 py-0.5 rounded-full ${inc.severity === 'critical' ? 'bg-red-100 text-red-700' : inc.severity === 'major' ? 'bg-orange-100 text-orange-700' : 'bg-yellow-100 text-yellow-700'}">${inc.severity}</span>
                    </div>
                    <p class="text-xs text-gray-500 mb-2 ml-4">
                        ${formatDate(inc.created_at)}${inc.resolved_at ? ' &mdash; Resolved ' + formatDate(inc.resolved_at) : ' &mdash; Ongoing'}
                    </p>
                    <div class="ml-4 border-l-2 border-gray-100 pl-4 space-y-2">
                        ${(inc.updates || []).map(u => `
                            <div>
                                <span class="text-xs font-medium text-gray-500 uppercase">${u.status}</span>
                                <span class="text-xs text-gray-400 ml-2">${relativeTime(u.created_at)}</span>
                                <p class="text-sm text-gray-700 mt-0.5">${u.message}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function handleSubscribe(e) {
            e.preventDefault();
            const msg = document.getElementById('subscribe-msg');
            msg.textContent = 'Thank you! You will receive status updates at this email address.';
            msg.className = 'text-sm mt-2 text-green-600';
            msg.classList.remove('hidden');
            e.target.reset();
        }

        async function fetchStatus() {
            try {
                const [statusRes, historyRes, uptimeRes] = await Promise.all([
                    fetch(`${API_BASE}/api/v1/status`),
                    fetch(`${API_BASE}/api/v1/status/history`),
                    fetch(`${API_BASE}/api/v1/status/uptime`),
                ]);

                if (statusRes.ok) {
                    const data = await statusRes.json();
                    renderOverallBadge(data.status);
                    renderComponents(data.components);
                    renderActiveIncidents(data.active_incidents);
                    renderMaintenance(data.scheduled_maintenance);
                }

                if (historyRes.ok) {
                    const data = await historyRes.json();
                    renderIncidentHistory(data.incidents);
                }

                if (uptimeRes.ok) {
                    const data = await uptimeRes.json();
                    renderUptime(data.uptime, data.daily);
                }

                document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
            } catch (err) {
                console.error('Failed to fetch status:', err);
                document.getElementById('last-updated').textContent = 'Failed to connect to API';
            }
        }

        // Initial load
        fetchStatus();

        // Auto-refresh every 60 seconds
        setInterval(fetchStatus, 60000);
    </script>
</body>
</html>
